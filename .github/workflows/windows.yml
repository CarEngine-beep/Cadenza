name: Windows build

on:
  push:
    branches: [ master, main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Clone JUCE 8.0.13
        run: git clone --depth 1 --branch 8.0.13 https://github.com/juce-framework/JUCE.git lib/JUCE

      - name: Set up MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Set up Ninja
        uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Install FluidSynth via vcpkg
        shell: pwsh
        run: |
          git clone --depth 1 https://github.com/microsoft/vcpkg.git C:\vcpkg-classic
          & C:\vcpkg-classic\bootstrap-vcpkg.bat -disableMetrics
          & C:\vcpkg-classic\vcpkg.exe install fluidsynth:x64-windows

      - name: Configure
        shell: pwsh
        run: |
          cmake -S . -B build-msvc -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_TOOLCHAIN_FILE="C:\vcpkg-classic\scripts\buildsystems\vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows

      - name: Build
        run: cmake --build build-msvc --config Release

      - name: Test
        run: ctest --test-dir build-msvc --output-on-failure

      - name: Package Cadenza Workstation EXE, resources, and DLLs
        shell: pwsh
        run: |
          $outDir = "cadenza-windows-release"
          New-Item -ItemType Directory -Force -Path $outDir | Out-Null

          # Copy JUCE GUI app artefact directory (includes Cadenza Workstation.exe and resources/)
          $juceAppDir = Get-ChildItem -Path "build-msvc" -Recurse -Directory -Filter "Cadenza_artefacts" |
            ForEach-Object { Get-ChildItem -Path $_.FullName -Recurse -Directory -Filter "Release" } |
            Select-Object -First 1

          if ($juceAppDir) {
            Copy-Item -Path "$($juceAppDir.FullName)\*" -Destination $outDir -Recurse -Force
          }

          # Fallback: copy any built .exe files if Cadenza_artefacts isn't found
          Get-ChildItem -Path "build-msvc" -Recurse -Filter "*.exe" |
            Where-Object { $_.FullName -notmatch "\\tests\\" -and $_.FullName -notmatch "test" } |
            ForEach-Object {
              Copy-Item -Path $_.FullName -Destination $outDir -Force
            }

          # Copy vcpkg runtime DLLs (FluidSynth and dependencies) next to the .exe
          $vcpkgBin = "C:\vcpkg-classic\installed\x64-windows\bin"
          if (Test-Path $vcpkgBin) {
            Copy-Item -Path "$vcpkgBin\*.dll" -Destination $outDir -Force
          }

      - name: Upload Windows build artifact
        uses: actions/upload-artifact@v4
        with:
          name: cadenza-windows-exe
          path: cadenza-windows-release/
          if-no-files-found: error
